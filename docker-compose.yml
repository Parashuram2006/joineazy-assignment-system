version: '3.9'
​services:
postgres:
image: postgres:16-alpine
container_name: joineazy_postgres
restart: unless-stopped
environment:
POSTGRES_USER: joineazy
POSTGRES_PASSWORD: joineazy_password
POSTGRES_DB: joineazy_db
ports:
- "5432:5432"
volumes:
- joineazy_pgdata:/var/lib/postgresql/data
- ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
healthcheck:
test: ["CMD-SHELL", "pg_isready -U joineazy -d joineazy_db"]
interval: 5s
timeout: 5s
retries: 5
​backend:
image: node:20-alpine
container_name: joineazy_backend
working_dir: /app
volumes:
- ./backend:/app
command: sh -c "npm install && npm start"
environment:
PORT: 5000
DATABASE_URL: postgres://joineazy:joineazy_password@postgres:5432/joineazy_db
JWT_SECRET: joineazy_production_secret_key
ports:
- "5000:5000"
depends_on:
postgres:
condition: service_healthy
​volumes:
joineazy_pgdata:
